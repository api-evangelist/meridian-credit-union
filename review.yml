actions:
  apisYmlUpdated: true
  reason: |
    Identity-only bootstrap. No first-party public API, developer portal, or
    downloadable specification exists to harvest; apis[] is intentionally empty and
    honest. Data-access reality (aggregator-mediated via Plaid and Central 1/Flinks
    Outbound) and Canada's not-yet-operational Consumer-Driven Banking posture are
    recorded here rather than fabricated as API entries.
