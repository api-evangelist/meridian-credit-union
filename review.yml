aid: meridian-credit-union
name: Meridian Credit Union
review:
  question: Does Meridian Credit Union expose a first-party public developer API or downloadable OpenAPI specification?
  answer: false
  date: '2026-07-23'
  reviewer: API Evangelist
findings:
  summary: |
    Meridian Credit Union — Ontario's largest credit union and a member-owned
    cooperative (~365,000 members, ~CAD $31B AUM), regulated provincially by the
    Financial Services Regulatory Authority of Ontario (FSRA), not a Schedule I/II
    bank — publishes no first-party public developer portal, no developer API, and
    no downloadable OpenAPI/Swagger specification. The conventional developer
    subdomain developer.meridiancu.ca does not resolve (DNS ENOTFOUND), and the
    public website (www.meridiancu.ca) documents no API products. There is no
    OAuth2/OIDC, API-key, or mTLS-secured public API surface to authenticate against,
    because no public API is exposed.

    Consumer data access for Meridian is aggregator-mediated, which is the honest
    and typical posture for a Canadian credit union today. Plaid maintains a Meridian
    institution connector for consumer-permissioned linking, and the Central 1 /
    Flinks Outbound seam provides API-based data sharing across member credit unions.
    Meridian is not a documented FDX participant and has published no stated 1033-style
    data-access posture; the U.S. Section 1033 rule is not applicable to a Canadian
    institution.

    Canada's Consumer-Driven Banking (open banking) framework was legislated in 2024
    (Budget 2024 + Fall Economic Statement 2024, overseen by the FCAC) but is not yet
    operational, so no mandated open-banking API exists. Meridian's open-finance
    participation is therefore voluntary and aggregator-based.
